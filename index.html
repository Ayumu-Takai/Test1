<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Mini Platformer</title>
		<link rel="stylesheet" href="assets/css/styles.css">
	</head>
	<body>
		<div class="game-wrap">
			<canvas id="game" width="900" height="480"></canvas>
			<div class="hud">
				<button id="restart">再スタート</button>
				<span id="status"></span>
			</div>
			<div class="touch-controls">
				<button id="left-btn" aria-label="左">←</button>
				<button id="up-btn" aria-label="ジャンプ">↑</button>
				<button id="right-btn" aria-label="右">→</button>
			</div>
			<div id="goal-screen" class="goal-screen" style="display:none;">
				<div class="goal-text">ゴール！おめでとう！</div>
				<button id="retry-btn">もう一度やり直す</button>
			</div>
		</div>
	<script src="./assets/js/main.js"></script>
